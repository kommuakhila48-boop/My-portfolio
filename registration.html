<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

</head>
<style>
    * {
        justify-content: center;
        justify-items: center;
        text-align: center;
    }
</style>
<body>
    <header>
        <h1>Student Registration Form</h1>
        <form action="submit_registration.php" method="post">
            <label for="name">Name:</label>
            <input type="text"  placeholder="Enter your name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" placeholder="Enter your email" name="email" required><br><br>

             <label for="Contact">Contact:</label>
            <input type="tel" placeholder="Enter your contact number" name="contact" required maxlength="10"><br><br>

            <label for="Gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label><br><br>

            <label for="Qualification">Qualification:</label>
            <select name="course" required>
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="M.Tech">M.Tech</option>
                <option value="MBA">MBA</option>
                <option value="BBA">BBA</option>
            </select><br><br>

            <label for="DOB">Date of Birth:</label>
            <input type="date" name="dob" required><br><br>

            <label for="Parent Name">Parent Name</label>
            <input type="text" placeholder="Enter your parent name" parent name="parent name" required><br><br>
            <select name="Country_code" required>
                <option value="">Select Country Code</option>
                <option value="+1">+1 (USA)</option>
                <option value="+91">+91 (India)</option>
                <option value="+44">+44 (UK)</option>
                <option value="+61">+61 (Australia)</option>
            </select>
            <label for="Parent contact">Contact:</label>
            <input type="text" name="parent_contact" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" required>
            <br><br>

             <input type="submit" value="Register">
        </form>
    </header>
</body>
</html>
